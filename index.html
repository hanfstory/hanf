<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="bild.png" />
  <title>Hanf & Cannabis – PDF</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1f4037, #99f2c8);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 2rem;
    }
    .subtitle {
      opacity: 0.9;
      font-size: 1rem;
    }
    .pdf-container {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 900px;
      height: 80vh;
      display: flex;
      flex-direction: column;
    }
    iframe {
      width: 100%;
      flex: 1;
      border: none;
      border-radius: 12px;
      background: white;
    }
    .error {
      padding: 20px;
      border-radius: 12px;
      background: rgba(255, 0, 0, 0.2);
      text-align: center;
      display: none;
    }
    .download-btn {
      margin-top: 16px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      color: white;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s;
      font-weight: 500;
    }
    .download-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Hanf & Cannabis</h1>
    <div class="subtitle">PDF-Dokument</div>
  </div>
  
  <div class="pdf-container">
    <iframe id="pdf-viewer" src="geschichte.pdf" type="application/pdf"></iframe>
    <div id="error" class="error">
      ⚠️ Die Datei <strong>geschichte.pdf</strong> konnte nicht geladen werden.<br />
      Stelle sicher, dass sie im gleichen Ordner liegt.
      <br />
      <a href="geschichte.pdf" class="download-btn" download>PDF herunterladen</a>
    </div>
  </div>

  <script>
    const iframe = document.getElementById('pdf-viewer');
    const errorBox = document.getElementById('error');
    
    iframe.addEventListener('error', () => {
      iframe.style.display = 'none';
      errorBox.style.display = 'block';
    });

    // Check if PDF loaded after a delay
    setTimeout(() => {
      if (!iframe.contentWindow || iframe.contentWindow.length === 0) {
        iframe.style.display = 'none';
        errorBox.style.display = 'block';
      }
    }, 2000);
  </script>
</body>
</html>
